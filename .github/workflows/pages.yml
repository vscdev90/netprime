name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 5 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Restore TMDB trailer cache
        uses: actions/cache/restore@v4
        with:
          path: .cache
          key: tmdb-trailer-cache-${{ github.run_id }}
          restore-keys: |
            tmdb-trailer-cache-
      - name: Fetch releases from TMDB
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/fetch-releases.mjs
      - name: Save TMDB trailer cache
        uses: actions/cache/save@v4
        with:
          path: .cache
          key: tmdb-trailer-cache-${{ github.run_id }}
      # upload-pages-artifact packages the whole working directory and only
      # excludes .git/.github — .gitignore doesn't apply — so the build-time
      # cache would otherwise be published as part of the site. Removing it
      # after the cache has been saved keeps it out of the deployed output.
      - name: Remove build-time cache from published output
        run: rm -rf .cache
      - name: Cache-bust static assets
        run: |
          SHA_SHORT="${GITHUB_SHA::7}"
          sed -i "s#assets/app.js#assets/app.js?v=${SHA_SHORT}#" index.html
          sed -i "s#assets/style.css#assets/style.css?v=${SHA_SHORT}#" index.html
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
